# Blueprint da Render: servidor + cliente num só serviço, com PostgreSQL.
# Dashboard → New → Blueprint → escolha este repositório.
services:
  - type: web
    name: hide-and-hunt
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: CLIENT_DIST
        value: ../client/dist
      - key: LOG_LEVEL
        value: info
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hide-and-hunt-db
          property: connectionString

databases:
  - name: hide-and-hunt-db
    plan: free
    region: virginia
    databaseName: hidehunt
    user: hidehunt
