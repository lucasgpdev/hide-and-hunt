# Mantém o servidor gratuito da Render acordado: ele dorme após 15 minutos
# sem visitas. O agendamento do GitHub atrasa e pula execuções, então cada
# execução fica viva por quase 6 horas chamando a rota de saúde a cada 8
# minutos; o agendamento só precisa disparar algumas vezes por dia, e o
# "concurrency" garante que só uma fique rodando.
name: Manter servidor acordado

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Chamar /api/health a cada 8 minutos
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://hide-and-hunt-b2i2.onrender.com/api/health || true)
            echo "$(date -u +%H:%M) HTTP $code"
            sleep 480
          done
